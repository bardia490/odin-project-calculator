<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Calculator</title>
        <script src="main.js" defer></script>
    </head>
    <body>
        <h1>The Calculator</h1>
        <!-- Left 50%: Inputs & Equal Button -->
        <div class="main_grid">
            <div id="row1">
                <div class="first_number">
                    <label for="first_number">first number</label>
                    <input id="first_number" name="first_number" type="number" placeholder="0">
                </div>
                <div id="operation-wrapper">
                    <label for="operation">Operation</label>
                    <datalist id="operations">
                        <option value="+">
                        <option value="-">
                        <option value="x">
                        <option value="/">
                        <option value="%">
                    </datalist>
                    <input name="operation" list="operations" id="operation">
                </div>
            </div>
            <div id="row2">
                <div class="second_number">
                    <label for="second_number">second number</label>
                    <input name="second_number" id="second_number" name="second_number" type="number" placeholder="0">
                </div>
                <div id="equal-wrapper">
                    <button id="equal"> = </button>
                </div>
            </div>
        </div>
        <div id="bottom">
            <button id="clear" type="button">Clear</button>
        </div>
        <!-- Right 50%: Results Display Panel -->
        <aside id="result_container">
            <div class="result_card">
                <span class="result_label">Result</span>
                <div id="result_display" class="result_value">0</div>
            </div>
        </aside>
    </body>
</html>
